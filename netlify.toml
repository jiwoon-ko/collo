[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/rankings"
  to = "/.netlify/functions/rankings"
  status = 200

[[redirects]]
  from = "/api/posts/*"
  to = "/.netlify/functions/posts/:splat"
  status = 200

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts"
  status = 200

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach"
  status = 200

[[redirects]]
  from = "/api/ai-challenge"
  to = "/.netlify/functions/ai-challenge"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
